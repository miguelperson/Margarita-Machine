<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margarita Machine Preview</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --panel-alt: #374151;
        --accent: #f59e0b;
        --text: #f9fafb;
        --muted: #d1d5db;
        --danger: #ef4444;
        --success: #22c55e;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .app {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      .panel {
        background: var(--panel);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      h1, h2, h3 { margin-top: 0; }
      .drink-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
      }
      .drink-btn, .queue-btn, .custom-btn, .builder-btn, .delete-btn {
        border: none;
        border-radius: 12px;
        padding: 16px 12px;
        font-size: 1rem;
        font-weight: bold;
        background: var(--panel-alt);
        color: var(--text);
        cursor: pointer;
      }
      .builder-btn {
        padding: 12px 10px;
        background: rgba(245, 158, 11, 0.2);
      }
      .delete-btn {
        background: rgba(239, 68, 68, 0.15);
        color: var(--text);
        padding: 10px 12px;
        margin-left: 8px;
      }
      .custom-btn {
        width: 100%;
        background: var(--accent);
        color: #111827;
      }
      .drink-btn:hover, .queue-btn:hover, .custom-btn:hover, .builder-btn:hover, .delete-btn:hover { filter: brightness(1.08); }
      .custom-builder {
        display: grid;
        gap: 12px;
      }
      .builder-row {
        display: grid;
        grid-template-columns: minmax(140px, 1.3fr) minmax(90px, 0.6fr) auto;
        gap: 10px;
        align-items: end;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field label {
        font-size: 0.8rem;
        color: var(--muted);
      }
      select, input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(17, 24, 39, 0.6);
        color: var(--text);
        font-size: 1rem;
      }
      .queue-item {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        background: rgba(255,255,255,0.03);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 10px;
      }
      .queue-meta {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }
      .ingredient-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .ingredient-pill {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(245, 158, 11, 0.2);
        color: var(--text);
        font-size: 0.8rem;
      }
      .small { color: var(--muted); font-size: 0.9rem; }
      @media (max-width: 560px) {
        .builder-row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="panel">
        <h1>Margarita Machine</h1>
        <p class="small">Preview the landing page locally without flashing the ESP32.</p>
      </div>

      <div class="panel">
        <h2>Preset Drinks</h2>
        <div class="drink-grid">
          <button class="drink-btn" data-preset="Classic Margarita" data-oz="4">Classic Margarita</button>
          <button class="drink-btn" data-preset="Tequila Sunrise" data-oz="5">Tequila Sunrise</button>
          <button class="drink-btn" data-preset="Lime Cooler" data-oz="6">Lime Cooler</button>
          <button class="drink-btn" data-preset="Frozen Punch" data-oz="7.5">Frozen Punch</button>
        </div>
      </div>

      <div class="panel">
        <h2>Custom Drink</h2>
        <div class="custom-builder">
          <div class="builder-row">
            <div class="field">
              <label for="liquor-select">Liquor</label>
              <select id="liquor-select">
                <option value="Tequila">Tequila</option>
                <option value="Rum">Rum</option>
                <option value="Whisky">Whisky</option>
                <option value="Vodka">Vodka</option>
              </select>
            </div>
            <div class="field">
              <label for="liquor-oz">Ounces</label>
              <select id="liquor-oz">
                <option value="0.5">0.5</option>
                <option value="1.0">1.0</option>
                <option value="1.5" selected>1.5</option>
                <option value="2.0">2.0</option>
                <option value="2.5">2.5</option>
                <option value="3.0">3.0</option>
                <option value="3.5">3.5</option>
                <option value="4.0">4.0</option>
              </select>
            </div>
            <button id="add-liquor-btn" class="builder-btn" type="button">Add liquor</button>
          </div>

          <div class="builder-row">
            <div class="field">
              <label for="mixer-select">Mixer</label>
              <select id="mixer-select">
                <option value="Club soda">Club soda</option>
                <option value="Coke">Coke</option>
                <option value="Cranberry juice">Cranberry juice</option>
                <option value="Orange juice">Orange juice</option>
                <option value="Angry Orchard">Angry Orchard</option>
              </select>
            </div>
            <div class="field">
              <label for="mixer-oz">Ounces</label>
              <select id="mixer-oz">
                <option value="0.5">0.5</option>
                <option value="1.0">1.0</option>
                <option value="1.5">1.5</option>
                <option value="2.0" selected>2.0</option>
                <option value="2.5">2.5</option>
                <option value="3.0">3.0</option>
                <option value="3.5">3.5</option>
                <option value="4.0">4.0</option>
              </select>
            </div>
            <button id="add-mixer-btn" class="builder-btn" type="button">Add mixer</button>
          </div>

          <div id="custom-ingredient-list" class="ingredient-list"></div>
          <button id="queue-custom-drink-btn" class="custom-btn" type="button">Add custom drink to queue</button>
        </div>
      </div>

      <div class="panel">
        <h2>Queue</h2>
        <div id="queue"></div>
      </div>
    </div>

    <script>
      const liquorOptions = ['Tequila', 'Rum', 'Whisky', 'Vodka'];
      const mixerOptions = ['Club soda', 'Coke', 'Cranberry juice', 'Orange juice', 'Angry Orchard'];

      let queue = [
        {
          id: 'demo-1',
          name: 'Classic Margarita',
          totalOz: 4,
          payload: JSON.stringify({
            items: [
              { name: 'Tequila', oz: 2 },
              { name: 'Lime juice', oz: 1 },
              { name: 'Triple sec', oz: 1 }
            ]
          })
        },
        {
          id: 'demo-2',
          name: 'Tequila Sunrise',
          totalOz: 5,
          payload: JSON.stringify({
            items: [
              { name: 'Tequila', oz: 2 },
              { name: 'Orange juice', oz: 2 },
              { name: 'Grenadine', oz: 1 }
            ]
          })
        }
      ];
      let customDrinkNumber = 1;
      let customDraftItems = [];

      function parseIngredients(item) {
        if (!item) {
          return [{ name: 'Custom blend', oz: 0 }];
        }

        try {
          const payload = JSON.parse(item.payload || '{}');
          const ingredients = Array.isArray(payload.items) ? payload.items : [];
          if (ingredients.length) {
            return ingredients
              .map((entry) => ({ name: entry.name || 'Ingredient', oz: Number(entry.oz) || 0 }))
              .filter((entry) => entry.oz > 0);
          }
        } catch (error) {
          // Ignore parse errors and fall back below.
        }

        return [{ name: item.name || 'Custom blend', oz: Number(item.totalOz) || 0 }];
      }

      function renderCustomDraft() {
        const listEl = document.getElementById('custom-ingredient-list');
        if (!customDraftItems.length) {
          listEl.innerHTML = '<div class="small">No ingredients selected yet.</div>';
          return;
        }

        listEl.innerHTML = customDraftItems
          .map((item) => `<span class="ingredient-pill">${item.name} · ${Number(item.oz).toFixed(1)} oz</span>`)
          .join('');
      }

      function updateQueueDisplay() {
        const queueEl = document.getElementById('queue');
        if (!queue.length) {
          queueEl.innerHTML = '<div class="small">No drinks in the queue.</div>';
          return;
        }

        queueEl.innerHTML = queue.map((item) => {
          const ingredients = parseIngredients(item);
          const ingredientMarkup = ingredients
            .map((ingredient) => `<span class="ingredient-pill">${ingredient.name} · ${Number(ingredient.oz).toFixed(1)} oz</span>`)
            .join('');

          return `
            <div class="queue-item">
              <div class="queue-meta">
                <strong>${item.name}</strong>
                <div class="ingredient-list">${ingredientMarkup}</div>
                <span class="small">${Number(item.totalOz).toFixed(1)} oz total</span>
              </div>
              <div>
                <button class="queue-btn" data-id="${item.id}">Dispense</button>
                <button class="delete-btn" data-id="${item.id}">Delete</button>
              </div>
            </div>
          `;
        }).join('');
      }

      function addDrinkToQueue(name, items) {
        queue.push({
          id: `demo-${Date.now()}-${Math.random().toString(16).slice(2, 8)}`,
          name,
          totalOz: items.reduce((total, ingredient) => total + Number(ingredient.oz || 0), 0),
          payload: JSON.stringify({ items })
        });
        updateQueueDisplay();
      }

      function addCustomIngredient(type, valueId, ozId) {
        const ingredientName = document.getElementById(valueId).value;
        const ozValue = Number(document.getElementById(ozId).value);

        if (!ingredientName || !Number.isFinite(ozValue) || ozValue <= 0) {
          alert('Choose an ingredient and set a valid ounce amount.');
          return;
        }

        customDraftItems.push({
          name: ingredientName,
          oz: ozValue,
          type
        });
        renderCustomDraft();
        document.getElementById(valueId).selectedIndex = 0;
        document.getElementById(ozId).value = type === 'liquor' ? '1.5' : '2.0';
      }

      document.querySelectorAll('.drink-btn').forEach((button) => {
        button.addEventListener('click', () => {
          const name = button.dataset.preset;
          const oz = Number(button.dataset.oz || 0);
          addDrinkToQueue(name, [{ name, oz }]);
        });
      });

      document.getElementById('add-liquor-btn').addEventListener('click', () => {
        addCustomIngredient('liquor', 'liquor-select', 'liquor-oz');
      });

      document.getElementById('add-mixer-btn').addEventListener('click', () => {
        addCustomIngredient('mixer', 'mixer-select', 'mixer-oz');
      });

      document.getElementById('queue-custom-drink-btn').addEventListener('click', () => {
        if (!customDraftItems.length) {
          alert('Add at least one liquor or mixer before sending this drink to the queue.');
          return;
        }

        const name = `Custom drink #${customDrinkNumber}`;
        customDrinkNumber += 1;
        addDrinkToQueue(name, customDraftItems.map(({ name, oz }) => ({ name, oz })));
        customDraftItems = [];
        renderCustomDraft();
      });

      document.addEventListener('click', (event) => {
        const deleteButton = event.target.closest('.delete-btn');
        if (deleteButton) {
          queue = queue.filter((item) => item.id !== deleteButton.dataset.id);
          updateQueueDisplay();
          return;
        }

        const dispenseButton = event.target.closest('.queue-btn');
        if (dispenseButton) {
          queue = queue.filter((item) => item.id !== dispenseButton.dataset.id);
          updateQueueDisplay();
        }
      });

      renderCustomDraft();
      updateQueueDisplay();
    </script>
  </body>
</html>
